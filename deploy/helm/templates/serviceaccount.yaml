{{/*
One ServiceAccount for the whole system.

The AS processes hold no state and talk only to Redis, PostgreSQL and the OTLP
collector: they need no access to the Kubernetes API, so the token is not
mounted. See ADR-0002 (stateless process) and REQ-NF-9 (one namespace per
customer system).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "as.fullname" . }}
  namespace: {{ include "as.namespace" . }}
  labels:
    {{- include "as.labels" . | nindent 4 }}
automountServiceAccountToken: false
