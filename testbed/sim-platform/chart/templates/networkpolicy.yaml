{{- if and .Values.networkPolicy.enabled .Values.components.ui }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: call-load-egress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ims-sim
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: call-load
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: scscf
      ports:
        - protocol: UDP
          port: {{ .Values.sip.udpPort }}
        - protocol: TCP
          port: {{ .Values.sip.tcpPort }}
        - protocol: TCP
          port: {{ .Values.sip.tlsPort }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.components.sut }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sut-sip-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ims-sim
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sut
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.simNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: ssbc-north
      ports:
        - protocol: UDP
          port: {{ .Values.sip.udpPort }}
        - protocol: TCP
          port: {{ .Values.sip.tcpPort }}
        - protocol: TCP
          port: {{ .Values.sip.tlsPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.simNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: ssbc-south
      ports:
        - protocol: UDP
          port: {{ .Values.sip.udpPort }}
        - protocol: TCP
          port: {{ .Values.sip.tcpPort }}
        - protocol: TCP
          port: {{ .Values.sip.tlsPort }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
