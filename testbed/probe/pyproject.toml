[project]
name = "as-probe"
version = "0.1.0"
description = "SIP stack selection probes for ADR-0019: E1 baseline replay, E4 TLS hot rotation, and the pure sequence comparator"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
keywords = ["sip", "ims", "probe", "testbed"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Communications :: Telephony",
]

# The probes parse and build SIP messages with the kernel's parser, so a probe
# and the AS can never disagree about where a message ends.
dependencies = [
  "as-platform",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_probe"]

[tool.uv.sources]
as-platform = { workspace = true }
